name: CI | Coverall Cyberia

on:
  push:
    branches: ['master', 'main']
  pull_request:
    branches: ['master', 'main']

jobs:
  test:
    name: Coverall Cyberia Test
    # Deliberately not the engine repository: two coverage workflows on one commit
    # are two Coveralls builds, and the badge then shows whichever landed last
    # rather than the tree's coverage. The engine is served by coverall.ci.yml.
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.repository == 'underpostnet/engine-cyberia' ||
       github.repository == 'underpostnet/engine-ghpkg-cyberia')
    runs-on: ubuntu-latest
    container:
      image: quay.io/rockylinux/rockylinux:9
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install required packages
        run: |
          dnf install -y sudo tar gzip bzip2 git bash
          dnf install -y curl --allowerasing

      - name: Install Node.js
        run: |
          curl -fsSL https://rpm.nodesource.com/setup_24.x | bash -
          dnf install nodejs -y

      - name: Install project dependencies
        run: npm install

      # Every lcov-producing tier in one run: the report Coveralls receives is the
      # whole measured tree, and the threshold is checked against that same number.
      # Set the COVERAGE_MIN repository variable to gate below the shipped default
      # while the suite is catching up to it.
      - name: Run tests and enforce coverage threshold
        run: npm run test:coverage
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN }}

      - name: Store coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverall-cyberia-lcov
          path: ./coverage/lcov.info
          if-no-files-found: error

  upload:
    name: Upload Cyberia Coverage to Coveralls
    needs: test
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.repository == 'underpostnet/engine-cyberia' ||
       github.repository == 'underpostnet/engine-ghpkg-cyberia')
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Restore coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverall-cyberia-lcov
          path: ./coverage

      # One report per commit, so the build is complete on arrival: no parallel
      # flags to reconcile and no finish webhook to leave a build half-reported.
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          format: lcov
          fail-on-error: true
